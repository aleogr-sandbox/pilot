# aleogr-ci 1 admin:admin:go:1.27,status:status:go:1.27
# Generated by aleogr from .aleogr/project.json. Do not edit: change the declaration and run project-apply.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      status: ${{ steps.filter.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            admin:
              - 'admin/**'
              - '.github/workflows/ci.yml'
            status:
              - 'status/**'
              - '.github/workflows/ci.yml'

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    uses: aleogr/aleogr/.github/workflows/ci-go.yml@e481728b69c05d948adaede336571d4354ccaf8d
    with:
      working-directory: "admin"
      go-version: "1.27"

  status:
    needs: changes
    if: needs.changes.outputs.status == 'true'
    uses: aleogr/aleogr/.github/workflows/ci-go.yml@e481728b69c05d948adaede336571d4354ccaf8d
    with:
      working-directory: "status"
      go-version: "1.27"

  ci:
    needs: [changes, admin, status]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The change detection passed, and every component job passed or was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ needs.admin.result }} ${{ needs.status.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "the job changes ended: $CHANGES"; exit 1; fi
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a component job ended: $r"; exit 1 ;; esac
          done
